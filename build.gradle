plugins {
    id 'java'
}

group = 'org.example'
version = '1.0.2'

// Single source of truth for publishing: Plugin-Mainversion and the
// _Plugin-Url download entry below are derived from these two values,
// so a release is just `version = 'x.y.z'` + tag `vx.y.z` (see README).
def josmMainVersion = '19000'
def pluginSiteUrl = 'https://github.com/privatemajory/josm-regex-replace-plugin'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // Put josm-tested.jar (or josm-custom.jar) in libs/ before building.
    // Easiest source: your existing JOSM install directory, or
    // https://josm.openstreetmap.de/download/ (josm-tested.jar).
    compileOnly files('libs/josm-tested.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

test {
    useJUnitPlatform()
}

// This plugin is published externally (self-hosted jar + wiki Plugins entry),
// so this Gradle manifest IS the release manifest. Releasing is just
// `version = 'x.y.z'` above plus pushing tag `vx.y.z` (see README "Release").
jar {
    archiveFileName = 'regexreplace.jar'
    manifest {
        attributes(
            'Plugin-Class'                : 'org.example.josmregexreplace.RegexReplacePlugin',
            'Plugin-Version'              : version,
            'Plugin-Description'          : 'Search and replace tag values using a regular expression',
            // Lowest JOSM this code runs on; spi.preferences APIs postdate 18000.
            // Lower only after testing on older JOSM.
            'Plugin-Mainversion'          : josmMainVersion,
            'Author'                      : 'Dolly Andriatsiferana <privatemajory@gmail.com>',
            'Plugin-Link'                 : pluginSiteUrl,
            'Plugin-Icon'                 : 'images/regexreplace.svg',
            'Plugin-Minimum-Java-Version' : '17',
            'Plugin-Date'                 : new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ssX").format(new Date()),
            // Lets JOSM install/update straight from the GitHub Release asset.
            // Format: <lowest-JOSM>_Plugin-Url: <plugin-version>;<download-url>
            ("${josmMainVersion}_Plugin-Url".toString()) : "${version};${pluginSiteUrl}/releases/download/v${version}/regexreplace.jar"
        )
    }
}
