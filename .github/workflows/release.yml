# Release: push a tag `v<version>` (must match `version` in build.gradle)
# and this builds, tests, and attaches regexreplace.jar to a GitHub Release.
# JOSM installs/updates straight from that asset via the manifest's
# <mainversion>_Plugin-Url entry. Afterwards, update the wiki Plugins entry
# (see README "Release").
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches build.gradle version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(grep -oP "^version\s*=\s*'\K[^']+" build.gradle)
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match build.gradle version '$VER'"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew jar test

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/regexreplace.jar
          generate_release_notes: true
